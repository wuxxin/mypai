<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #2d3142; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 12px; fill: #4f5d75; }
      .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.18em; text-transform: uppercase; }
      .bank-title { font-family: 'Geist', sans-serif; font-size: 14px; font-weight: 600; fill: #2d3142; }
      .bank-sub { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
      .node-title { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; text-anchor: middle; }
      .model-tag { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #2d3142; }
      .arrow-lbl { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #7a8399; letter-spacing: 0.06em; text-anchor: middle; }
      .legend-title { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; }
      .legend-lbl { font-family: 'Geist', sans-serif; font-size: 11px; fill: #2d3142; }
      .aside { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 14px; fill: #eb6c36; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="48" y="44" class="eyebrow">VIEW 04 · COGNITIVE MEMORY</text>
  <text x="48" y="76" class="title">Dual-Profile Hindsight Memory &amp; Mental Model Architecture</text>
  <text x="48" y="96" class="subtitle">Partitioned memory tiers separating high-level LifeOS governance from tactical project-tagged coding facts</text>

  <!-- Connectors -->
  <!-- 1. MyPai bank to Hindsight Server -->
  <path d="M 440 280 L 580 280 Q 588 280 588 288 L 588 336" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  
  <!-- 2. OMP bank to Hindsight Server -->
  <path d="M 440 504 L 580 504 Q 588 504 588 496 L 588 440" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- 3. Hindsight to Consolidation -->
  <line x1="808" y1="388" x2="876" y2="388" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 4. membank-ctl sync tool -->
  <path d="M 232 632 L 232 592 Q 232 584 240 584 L 320 584" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Bank 1: MyPai Profile (Focal 1) -->
  <rect x="48" y="136" width="392" height="288" rx="8" fill="#f5f5f5"/>
  <rect x="48" y="136" width="392" height="288" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  
  <text x="72" y="168" class="bank-title" fill="#eb6c36">MyPai Bank (mypai.yaml)</text>
  <text x="72" y="184" class="bank-sub">Scope: global · retainMode: turn · autoRecall: false</text>

  <!-- 8 Mental Models Grid -->
  <rect x="72" y="200" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="80" y="220" class="model-tag">1. principal-telos</text>

  <rect x="248" y="200" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="256" y="220" class="model-tag">2. user-profile</text>

  <rect x="72" y="240" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="80" y="260" class="model-tag">3. worldview-philosophy</text>

  <rect x="248" y="240" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="256" y="260" class="model-tag">4. operating-heuristics</text>

  <rect x="72" y="280" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="80" y="300" class="model-tag">5. active-commitments</text>

  <rect x="248" y="280" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="256" y="300" class="model-tag">6. people-network</text>

  <rect x="72" y="320" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="80" y="340" class="model-tag">7. lifeos-anti-criteria</text>

  <rect x="248" y="320" width="168" height="32" rx="4" fill="#ffffff" stroke="rgba(235,108,54,0.3)" stroke-width="1"/>
  <text x="256" y="340" class="model-tag">8. strategic-vocabulary</text>

  <text x="72" y="384" class="aside">"Curated reflection and explicit retention govern user mental models"</text>

  <!-- Bank 2: Base OMP Bank -->
  <rect x="48" y="440" width="392" height="152" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="72" y="468" class="bank-title">Base OMP Bank (oh-my-pi.yaml)</text>
  <text x="72" y="484" class="bank-sub">Scope: per-project-tagged · autoRecall: true · autoRetain: true</text>

  <rect x="72" y="500" width="168" height="32" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
  <text x="80" y="520" class="model-tag">project-conventions</text>

  <rect x="248" y="500" width="168" height="32" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
  <text x="256" y="520" class="model-tag">project-decisions</text>

  <rect x="72" y="540" width="344" height="32" rx="4" fill="#f5f5f5" stroke="#7a8399" stroke-width="1"/>
  <text x="80" y="560" class="model-tag">Tactical diffs, error traces &amp; repository patterns</text>

  <!-- Hindsight Engine (Focal 2) -->
  <rect x="520" y="336" width="288" height="104" rx="8" fill="#f5f5f5"/>
  <rect x="520" y="336" width="288" height="104" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="528" y="342" width="48" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="552" y="351" class="node-tag" fill="#eb6c36">ENGINE</text>
  <text x="664" y="382" class="node-title">Hindsight Server (:8888)</text>
  <text x="664" y="398" class="node-sub">Vector (HNSW) + BM25 Hybrid Embeddings</text>
  <text x="664" y="416" class="node-sub">/reflect · /recall · /retain · /mental-models</text>

  <!-- Consolidation Pipeline -->
  <rect x="880" y="336" width="272" height="104" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1016" y="364" class="node-title">Continuous Background Consolidation</text>
  <text x="1016" y="384" class="node-sub">Automated /consolidate sweeps</text>
  <text x="1016" y="400" class="node-sub">Mental Model distillation (/refresh)</text>
  <text x="1016" y="416" class="node-sub">Anti-criteria pattern extraction</text>

  <!-- CLI Provisioning Box -->
  <rect x="48" y="608" width="392" height="40" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="244" y="628" class="node-title">bin/membank-ctl update --all</text>
  <text x="244" y="640" class="node-sub">Idempotent schema &amp; seed synchronization</text>

  <!-- Legend -->
  <line x1="48" y1="672" x2="1152" y2="672" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="48" y="692" class="legend-title">LEGEND</text>

  <rect x="144" y="684" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="168" y="694" class="legend-lbl">MyPai LifeOS Governance Bank</text>

  <rect x="400" y="684" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="424" y="694" class="legend-lbl">Base OMP Tactical Project Bank</text>

  <line x1="680" y1="690" x2="712" y2="690" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="724" y="694" class="legend-lbl">Model Sync / Ingestion</text>
</svg>
