<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card-bg { fill: #131b2e; stroke: #23314e; stroke-width: 1.5; rx: 8px; }
      .card-highlight { fill: #182642; stroke: #3b82f6; stroke-width: 2; rx: 8px; }
      .card-accent { fill: #1c2333; stroke: #f97316; stroke-width: 1.5; rx: 8px; }
      .card-green { fill: #13271f; stroke: #10b981; stroke-width: 1.5; rx: 8px; }
      .card-purple { fill: #201a35; stroke: #a855f7; stroke-width: 1.5; rx: 8px; }
      .title-text { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
      .sub-text { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .code-text { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .header-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; }
      .header-desc { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .group-box { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
      .group-label { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
      .conn { stroke: #334155; stroke-width: 1.5; fill: none; }
      .conn-active { stroke: #3b82f6; stroke-width: 2; fill: none; }
      .conn-green { stroke: #10b981; stroke-width: 1.5; fill: none; }
      .conn-orange { stroke: #f97316; stroke-width: 1.5; fill: none; }
      .conn-purple { stroke: #a855f7; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" class="bg" />

  <!-- Diagram Title -->
  <text x="40" y="45" class="header-title">03 · In-Kernel Python eval &amp; Loopback Tool Bridge Architecture</text>
  <text x="40" y="68" class="header-desc">Zero-overhead in-process tool execution through OMP's persistent Python kernel and host loopback bridge</text>

  <!-- Group 1: Persistent Python Kernel Subprocess -->
  <rect x="40" y="95" width="480" height="585" class="group-box" />
  <text x="55" y="120" class="group-label">Persistent Python Subprocess ($OMP_PYTHON_VENV)</text>

  <!-- Kernel Core / Runner -->
  <rect x="55" y="140" width="450" height="90" class="card-highlight" />
  <text x="75" y="165" class="title-text">runner.py &amp; kernel.ts Subprocess Lifecycle</text>
  <text x="75" y="185" class="sub-text">Persistent process kept alive across all agent turns; preserves in-memory globals</text>
  <text x="75" y="205" class="code-text">globals(): _SESSION_BOOTSTRAPPED, _MENTAL_MODELS, _LAST_ERROR</text>

  <!-- Injected Prelude &amp; Proxy -->
  <rect x="55" y="245" width="450" height="135" class="card-green" />
  <text x="75" y="270" class="title-text">prelude.py &amp; tool Proxy Injection</text>
  <text x="75" y="290" class="sub-text">Injected into runner namespace before first eval cell runs</text>
  <text x="75" y="312" class="code-text">tool = _ToolProxy()  # Dynamic method dispatcher</text>
  <text x="75" y="332" class="code-text">tool.reflect(query="...") ➔ IPC call to MemoryReflectTool</text>
  <text x="75" y="352" class="code-text">tool.retain(items=[...]) ➔ IPC call to MemoryRetainTool</text>
  <text x="75" y="368" class="code-text">tool.read(), tool.search(), tool.task(), tool.write()</text>

  <!-- mypai_http Client Library -->
  <rect x="55" y="395" width="450" height="110" class="card-accent" />
  <text x="75" y="420" class="title-text">mypai_http Reusable High-Level Client</text>
  <text x="75" y="440" class="sub-text">In-process curl replacement powered by httpx (auto-JSON, verify=False)</text>
  <text x="75" y="462" class="code-text">amux.post("messages", target=..., body=...)</text>
  <text x="75" y="482" class="code-text">amux.post("board/cards", title=..., status="Todo")</text>

  <!-- Silence on Success / Error Trapping -->
  <rect x="55" y="520" width="450" height="145" class="card-bg" />
  <text x="75" y="545" class="title-text">Silence Discipline &amp; Diagnostic Traps</text>
  <text x="75" y="565" class="sub-text">Keeps agent context window 100% clean during normal operations</text>
  <text x="75" y="588" class="code-text">✓ Success: Zero stdout emitted (no LLM context noise)</text>
  <text x="75" y="608" class="code-text">✗ Exception: _LAST_ERROR = err; print directive:</text>
  <text x="75" y="628" class="code-text">  "[ERROR] Execute analyze_memory_failure() in eval to inspect"</text>
  <text x="75" y="648" class="code-text">  analyze_memory_failure() queries stats and bridge probes</text>

  <!-- Bridge Channel Connector in the Middle -->
  <rect x="545" y="275" width="130" height="130" class="card-purple" />
  <text x="560" y="305" class="title-text">Loopback</text>
  <text x="560" y="325" class="title-text">HTTP Bridge</text>
  <text x="560" y="350" class="code-text">POST /v1/tool</text>
  <text x="560" y="370" class="sub-text">Bearer Auth</text>
  <text x="560" y="390" class="sub-text">Local Socket/Port</text>

  <!-- Bridge Connectors -->
  <path d="M 505 310 L 545 310" class="conn-active" marker-end="url(#arrow)" />
  <path d="M 545 370 L 505 370" class="conn-green" marker-end="url(#arrow-green)" />

  <!-- Group 2: Host OMP Engine -->
  <rect x="700" y="95" width="360" height="585" class="group-box" />
  <text x="715" y="120" class="group-label">Host OMP Runtime Engine (Node / Rust)</text>

  <!-- Host Bridge Server -->
  <rect x="715" y="140" width="330" height="85" class="card-highlight" />
  <text x="735" y="165" class="title-text">ToolBridgeServer (tool-bridge.ts)</text>
  <text x="735" y="185" class="sub-text">Receives IPC POST from Python runner</text>
  <text x="735" y="205" class="code-text">Dispatches request to ToolSession registry</text>

  <!-- Registered Memory Tools -->
  <rect x="715" y="240" width="330" height="130" class="card-green" />
  <text x="735" y="265" class="title-text">Native Memory Tools</text>
  <text x="735" y="285" class="sub-text">packages/coding-agent/src/tools/</text>
  <text x="735" y="308" class="code-text">• MemoryReflectTool (memory-reflect.ts)</text>
  <text x="735" y="328" class="code-text">• MemoryRecallTool (memory-recall.ts)</text>
  <text x="735" y="348" class="code-text">• MemoryRetainTool (memory-retain.ts)</text>
  <text x="735" y="362" class="code-text">• MemoryEditTool (memory-edit.ts)</text>

  <!-- Registered Host System Tools -->
  <rect x="715" y="385" width="330" height="130" class="card-bg" />
  <text x="735" y="410" class="title-text">Native System &amp; Code Tools</text>
  <text x="735" y="430" class="sub-text">In-process TypeScript / Rust primitives</text>
  <text x="735" y="452" class="code-text">• ReadTool (read.ts) - Range slicing</text>
  <text x="735" y="472" class="code-text">• SearchTool (grep.ts) - Ripgrep engine</text>
  <text x="735" y="492" class="code-text">• WriteTool (write.ts) - Safe CAS edits</text>
  <text x="735" y="508" class="code-text">• TaskTool (task.ts) - Subagent spawn</text>

  <!-- Backend Link -->
  <rect x="715" y="530" width="330" height="135" class="card-purple" />
  <text x="735" y="555" class="title-text">Hindsight &amp; amux Integration</text>
  <text x="735" y="575" class="sub-text">Direct connection to local background daemons</text>
  <text x="735" y="598" class="code-text">• Hindsight State Session (hindsight/state.ts)</text>
  <text x="735" y="618" class="code-text">• Seeds &amp; Mental Models (hindsight/mental-models.ts)</text>
  <text x="735" y="638" class="code-text">• amux Board &amp; Message Sockets</text>

  <!-- Connecting Bridge to Host Engine -->
  <path d="M 675 310 L 715 310" class="conn-active" marker-end="url(#arrow)" />
  <path d="M 715 350 L 675 350" class="conn-green" marker-end="url(#arrow-green)" />

</svg>
