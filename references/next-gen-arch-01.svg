<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card-bg { fill: #131b2e; stroke: #23314e; stroke-width: 1.5; rx: 8px; }
      .card-highlight { fill: #182642; stroke: #3b82f6; stroke-width: 2; rx: 8px; }
      .card-accent { fill: #1c2333; stroke: #f97316; stroke-width: 1.5; rx: 8px; }
      .card-green { fill: #13271f; stroke: #10b981; stroke-width: 1.5; rx: 8px; }
      .card-purple { fill: #201a35; stroke: #a855f7; stroke-width: 1.5; rx: 8px; }
      .title-text { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
      .sub-text { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .code-text { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .tag-text { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .header-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 22px; }
      .header-desc { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .group-box { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
      .group-label { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
      .conn { stroke: #334155; stroke-width: 1.5; fill: none; }
      .conn-active { stroke: #3b82f6; stroke-width: 2; fill: none; }
      .conn-green { stroke: #10b981; stroke-width: 1.5; fill: none; }
      .conn-orange { stroke: #f97316; stroke-width: 1.5; fill: none; }
      .conn-purple { stroke: #a855f7; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" class="bg" />

  <!-- Diagram Title -->
  <text x="40" y="45" class="header-title">01 · Global System Topology &amp; Multi-Session Control Plane</text>
  <text x="40" y="68" class="header-desc">End-to-end orchestration connecting external Signal chat, amux control supervisor, persistent OMP sessions, and AoE</text>

  <!-- Group: External Ingress -->
  <rect x="40" y="95" width="220" height="585" class="group-box" />
  <text x="55" y="120" class="group-label">1. Ingress &amp; Chat</text>

  <!-- User Box -->
  <rect x="55" y="140" width="190" height="70" class="card-bg" />
  <text x="70" y="165" class="title-text">Signal Mobile / Desktop</text>
  <text x="70" y="185" class="sub-text">User Chat Client</text>
  <text x="70" y="200" class="code-text">E2EE Signal Protocol</text>

  <!-- signal-cli-rest-api Box -->
  <rect x="55" y="250" width="190" height="80" class="card-bg" />
  <text x="70" y="275" class="title-text">signal-cli-rest-api</text>
  <text x="70" y="295" class="sub-text">REST Gateway (:20889)</text>
  <text x="70" y="315" class="code-text">http://localhost:20889/v1</text>

  <!-- Bridge Adapter Box -->
  <rect x="55" y="370" width="190" height="80" class="card-bg" />
  <text x="70" y="395" class="title-text">signal_bridge.py</text>
  <text x="70" y="415" class="sub-text">WebSocket Adapter</text>
  <text x="70" y="435" class="code-text">Token Auth Protocol</text>

  <!-- cc-connect Box -->
  <rect x="55" y="490" width="190" height="95" class="card-highlight" />
  <text x="70" y="515" class="title-text">cc-connect</text>
  <text x="70" y="535" class="sub-text">Bridge Server (:9810)</text>
  <text x="70" y="555" class="code-text">agent = "tmux"</text>
  <text x="70" y="570" class="code-text">target = mypai-channel</text>

  <!-- Ingress Connectors -->
  <path d="M 150 210 L 150 250" class="conn-active" marker-end="url(#arrow)" />
  <path d="M 150 330 L 150 370" class="conn-active" marker-end="url(#arrow)" />
  <path d="M 150 450 L 150 490" class="conn-active" marker-end="url(#arrow)" />

  <!-- Group: amux Control Plane -->
  <rect x="290" y="95" width="260" height="585" class="group-box" />
  <text x="305" y="120" class="group-label">2. amux Control Plane (:28824)</text>

  <!-- amux-server Daemon -->
  <rect x="305" y="140" width="230" height="130" class="card-highlight" />
  <text x="320" y="168" class="title-text">amux-server (Axum)</text>
  <text x="320" y="190" class="sub-text">Rust Native Daemon</text>
  <text x="320" y="210" class="code-text">HTTPS REST API :28824</text>
  <text x="320" y="230" class="code-text">SQLite CAS Store &amp; Board</text>
  <text x="320" y="250" class="code-text">Inter-Worker Message Bus</text>

  <!-- amux Scheduler Engine -->
  <rect x="305" y="300" width="230" height="100" class="card-accent" />
  <text x="320" y="325" class="title-text">Rust Cron Scheduler</text>
  <text x="320" y="345" class="sub-text">Durable Sched Engine</text>
  <text x="320" y="365" class="code-text">POST /api/schedules</text>
  <text x="320" y="385" class="code-text">Direct Pane / Queue Trigger</text>

  <!-- amux Kanban Board -->
  <rect x="305" y="430" width="230" height="100" class="card-bg" />
  <text x="320" y="455" class="title-text">Kanban &amp; Work Claims</text>
  <text x="320" y="475" class="sub-text">Atomic Work Allocation</text>
  <text x="320" y="495" class="code-text">Invariant: Done != Verified</text>
  <text x="320" y="515" class="code-text">Todo ➔ Doing ➔ Done</text>

  <!-- Hindsight Memory Service Box -->
  <rect x="305" y="560" width="230" height="100" class="card-purple" />
  <text x="320" y="585" class="title-text">Hindsight Memory (:28888)</text>
  <text x="320" y="605" class="sub-text">Vector &amp; Mental Model Store</text>
  <text x="320" y="625" class="code-text">Bank: mypai (Global)</text>
  <text x="320" y="645" class="code-text">Bank: oh-my-pi (Project)</text>

  <!-- Group: Supervised OMP Sessions -->
  <rect x="580" y="95" width="270" height="585" class="group-box" />
  <text x="595" y="120" class="group-label">3. Managed tmux Agent Sessions</text>

  <!-- mypai-channel Session -->
  <rect x="595" y="140" width="240" height="120" class="card-green" />
  <text x="610" y="165" class="title-text">mypai-channel</text>
  <text x="610" y="185" class="sub-text">omp --profile mypai (Channel)</text>
  <text x="610" y="205" class="code-text">• omp eval + loopback tools</text>
  <text x="610" y="225" class="code-text">• User Intent Translation</text>
  <text x="610" y="245" class="code-text">• Outputs reply to cc-connect</text>

  <!-- mypai-main Session -->
  <rect x="595" y="280" width="240" height="135" class="card-highlight" />
  <text x="610" y="305" class="title-text">mypai-main</text>
  <text x="610" y="325" class="sub-text">omp --profile mypai (Main)</text>
  <text x="610" y="345" class="code-text">• Central Coordinator / Brain</text>
  <text x="610" y="365" class="code-text">• Manages Tasks &amp; Claims</text>
  <text x="610" y="385" class="code-text">• Evaluates Global Memory</text>
  <text x="610" y="405" class="code-text">• Dispatches Sandboxed Workers</text>

  <!-- mypai-cron Session -->
  <rect x="595" y="435" width="240" height="110" class="card-accent" />
  <text x="610" y="460" class="title-text">mypai-cron</text>
  <text x="610" y="480" class="sub-text">omp --profile mypai (Cron)</text>
  <text x="610" y="500" class="code-text">• Listens to CRON: triggers</text>
  <text x="610" y="520" class="code-text">• Executes in-process eval</text>
  <text x="610" y="535" class="code-text">• Silent on clean success</text>

  <!-- On-demand Workers -->
  <rect x="595" y="565" width="240" height="95" class="card-bg" />
  <text x="610" y="588" class="title-text">amux-task-worker-N</text>
  <text x="610" y="608" class="sub-text">omp (Normal Profile - Default)</text>
  <text x="610" y="628" class="code-text">• Scoped Working Directories</text>
  <text x="610" y="648" class="code-text">• Ephemeral Execution Lanes</text>

  <!-- Group: Agent of Empires -->
  <rect x="880" y="95" width="180" height="585" class="group-box" />
  <text x="895" y="120" class="group-label">4. Observability</text>

  <!-- AoE Cockpit -->
  <rect x="895" y="140" width="150" height="230" class="card-bg" />
  <text x="910" y="168" class="title-text">Agent of</text>
  <text x="910" y="190" class="title-text">Empires (aoe)</text>
  <text x="910" y="218" class="sub-text">Deep Cockpit UI</text>
  <text x="910" y="245" class="code-text">• TUI Matrix</text>
  <text x="910" y="270" class="code-text">• Web PWA</text>
  <text x="910" y="295" class="code-text">• ACP Struct Cards</text>
  <text x="910" y="320" class="code-text">• Live Git Diffs</text>
  <text x="910" y="345" class="code-text">• Breadcrumbs</text>

  <!-- AoE Web Server -->
  <rect x="895" y="390" width="150" height="90" class="card-bg" />
  <text x="910" y="415" class="title-text">aoe serve</text>
  <text x="910" y="435" class="sub-text">Web Dashboard</text>
  <text x="910" y="455" class="code-text">Tailscale / HTTPS</text>

  <!-- Inter-Component Cross Connections -->
  <!-- cc-connect to mypai-channel -->
  <path d="M 245 540 Q 550 540 595 200" class="conn-green" marker-end="url(#arrow-green)" />

  <!-- mypai-channel to amux-server message API -->
  <path d="M 595 220 L 535 220" class="conn-active" marker-end="url(#arrow)" />

  <!-- amux-server to mypai-main -->
  <path d="M 535 240 L 595 310" class="conn-active" marker-end="url(#arrow)" />

  <!-- scheduler to mypai-cron -->
  <path d="M 535 350 L 595 470" class="conn-orange" marker-end="url(#arrow-orange)" />

  <!-- mypai-cron to amux-server -->
  <path d="M 595 490 L 535 260" class="conn-orange" marker-end="url(#arrow-orange)" />

  <!-- mypai-main to workers -->
  <path d="M 715 415 L 715 565" class="conn-active" marker-end="url(#arrow)" />

  <!-- All sessions to AoE -->
  <path d="M 835 200 L 895 200" class="conn-purple" marker-end="url(#arrow-purple)" />
  <path d="M 835 340 L 895 230" class="conn-purple" marker-end="url(#arrow-purple)" />
  <path d="M 835 480 L 895 260" class="conn-purple" marker-end="url(#arrow-purple)" />
  <path d="M 835 600 L 895 290" class="conn-purple" marker-end="url(#arrow-purple)" />

</svg>
