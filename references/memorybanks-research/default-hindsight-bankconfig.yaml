version: '1'
bank:
  # Dispositions (weights 1-5, default 3/3/4)
  disposition_skepticism: 3
  disposition_literalism: 3
  disposition_empathy: 4

  # Retain / Ingestion Settings
  retain_extraction_mode: concise
  retain_chunk_size: 3000
  retain_chunk_batch_size: 100
  retain_structured_chunk_size: 3000
  retain_mission: >-
    Extract SIGNIFICANT facts from text. Be SELECTIVE - only extract facts worth remembering long-term.
  retain_custom_instructions: >-
    ONLY extract facts that are:
    - Personal info: names, relationships, roles, background
    - Preferences: likes, dislikes, habits, interests
    - Significant events: milestones, decisions, achievements, changes
    - Plans/goals: future intentions, deadlines, commitments
    - Expertise: skills, knowledge, certifications, experience
    - Important context: projects, problems, constraints
    - Sensory/emotional details: feelings, sensations, perceptions that provide context
    - Observations: descriptions of people, places, things with specific details
    DO NOT extract:
    - Generic greetings and pleasantries without substance
    - Pure filler ("thanks", "sounds good", "ok", "sure")
    - Process chatter ("let me check", "one moment")
    - Repeated info already stated
  retain_default_strategy: null
  retain_strategies: {}
  store_document_text: true

  # Entity Vocabulary & Defense
  entity_labels: {}
  entities_allow_free_form: true
  memory_defense:
    enabled: false

  # Observations & Consolidation Settings
  enable_observations: true
  enable_auto_consolidation: true
  observations_mission: >-
    Track anything notable in the new facts — names, numbers, dates, places, events, decisions, claims, relationships, and recurring patterns.
  consolidation_max_memories_per_round: 20
  consolidation_llm_batch_size: 1
  consolidation_llm_parallelism: 4
  consolidation_source_facts_max_tokens: 4096
  consolidation_source_facts_max_tokens_per_observation: 256
  max_observations_per_scope: -1
  observation_scope_limits: []

  # Reflect Settings
  reflect_mission: >-
    You are a reflection agent that answers questions by reasoning over retrieved memories.
  reflect_source_facts_max_tokens: -1

  # Recall & Retrieval Settings
  enable_temporal_retrieval: true
  enable_graph_retrieval: true
  enable_reranking: true
  recall_include_chunks: false
  recall_max_tokens: 1536
  recall_chunks_max_tokens: 500
  recall_budget_function: fixed
  recall_budget_fixed_low: 100
  recall_budget_fixed_mid: 300
  recall_budget_fixed_high: 1000
  recall_budget_adaptive_low: 0.025
  recall_budget_adaptive_mid: 0.075
  recall_budget_adaptive_high: 0.25
  recall_budget_min: 20
  recall_budget_max: 2000

  # Audit & Access Control
  audit_log_enabled: false
  mcp_enabled_tools:
    - retain
    - sync_retain
    - recall
    - reflect
    - list_banks
    - create_bank
    - list_mental_models
    - get_mental_model
    - create_mental_model
    - update_mental_model
    - delete_mental_model
    - refresh_mental_model
    - clear_mental_model
    - list_directives
    - create_directive
    - delete_directive
    - list_memories
    - get_memory
    - update_memory
    - invalidate_memory
    - list_documents
    - get_document
    - delete_document
    - list_operations
    - get_operation
  llm_gemini_safety_settings: []

mental_models: []
