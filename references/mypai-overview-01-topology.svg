<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #2d3142; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 12px; fill: #4f5d75; }
      .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.18em; text-transform: uppercase; }
      .node-title { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
      .node-tag { font-family: 'Geist Mono', monospace; font-size: 7px; fill: #4f5d75; letter-spacing: 0.08em; text-anchor: middle; }
      .arrow-lbl { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #7a8399; letter-spacing: 0.06em; text-anchor: middle; }
      .legend-title { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; }
      .legend-lbl { font-family: 'Geist', sans-serif; font-size: 11px; fill: #2d3142; }
      .aside { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 14px; fill: #eb6c36; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="48" y="44" class="eyebrow">VIEW 01 · DISTRIBUTED MESH</text>
  <text x="48" y="76" class="title">System Topology &amp; Multi-Session Control Plane</text>
  <text x="48" y="96" class="subtitle">Distributed daemon-less architecture governed by amux-server, in-kernel Python runtime, and Hindsight memory</text>

  <!-- Connectors (Drawn behind node boxes) -->
  <!-- 1. User/Signal to cc-connect -->
  <line x1="168" y1="216" x2="232" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  
  <!-- 2. cc-connect to mypai-channel (turn delivery) -->
  <line x1="392" y1="216" x2="456" y2="216" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 3. Channel to amux-server (POST /api/messages) -->
  <path d="M 536 264 L 536 320 Q 536 328 544 328 L 592 328" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- 4. amux-server to Main (Turn Delivery) -->
  <line x1="752" y1="328" x2="808" y2="328" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- 5. amux-server to Cron (CRON trigger) -->
  <path d="M 672 280 L 672 224 Q 672 216 680 216 L 808 216" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- 6. Cron to amux-server (Alerts & Cards) -->
  <path d="M 888 264 L 888 288 Q 888 296 880 296 L 752 296" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 7. Main to Worker Sessions (spawn / assign) -->
  <path d="M 888 376 L 888 440 Q 888 448 880 448 L 760 448" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M 888 376 L 888 504 Q 888 512 880 512 L 760 512" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 8. Main to Hindsight (tool.reflect / tool.retain) -->
  <path d="M 968 328 L 1024 328 Q 1032 328 1032 336 L 1032 400" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

  <!-- 9. aoe cockpit observing sessions -->
  <path d="M 232 480 L 400 480 Q 408 480 408 440 L 408 340" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Connector Labels with Masks (6-10px gap) -->
  <rect x="180" y="196" width="40" height="12" rx="2" fill="#f5f5f5"/>
  <text x="200" y="205" class="arrow-lbl">SIGNAL</text>

  <rect x="404" y="196" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="422" y="205" class="arrow-lbl">TMUX</text>

  <rect x="528" y="308" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="558" y="317" class="arrow-lbl">REST API</text>

  <rect x="756" y="308" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="778" y="317" class="arrow-lbl" fill="#eb6c36">TURN</text>

  <rect x="732" y="196" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="754" y="205" class="arrow-lbl">SCHEDULE</text>

  <!-- Node 1: External User (Input) -->
  <rect x="48" y="168" width="120" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="48" y="168" width="120" height="96" rx="6" fill="rgba(79,93,117,0.08)" stroke="#7a8399" stroke-width="1"/>
  <rect x="56" y="174" width="32" height="12" rx="2" fill="transparent" stroke="#7a8399" stroke-width="0.8"/>
  <text x="72" y="183" class="node-tag">USER</text>
  <text x="108" y="214" class="node-title">Human User</text>
  <text x="108" y="232" class="node-sub">Signal / Matrix</text>

  <!-- Node 2: cc-connect Gateway -->
  <rect x="232" y="168" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="232" y="168" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="240" y="174" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
  <text x="258" y="183" class="node-tag">BRIDGE</text>
  <text x="312" y="214" class="node-title">cc-connect</text>
  <text x="312" y="232" class="node-sub">:9810 · tmux-driver</text>

  <!-- Node 3: amux-mypai-channel -->
  <rect x="456" y="168" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="456" y="168" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="464" y="174" width="40" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
  <text x="484" y="183" class="node-tag">INGRESS</text>
  <text x="536" y="214" class="node-title">mypai-channel</text>
  <text x="536" y="232" class="node-sub">profile: mypai · eval</text>

  <!-- Node 4: amux-server Control Plane (Focal 1) -->
  <rect x="592" y="280" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="592" y="280" width="160" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="600" y="286" width="36" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="618" y="295" class="node-tag" fill="#eb6c36">AXUM</text>
  <text x="672" y="326" class="node-title">amux-server</text>
  <text x="672" y="344" class="node-sub">:28824 · SQLite Bus</text>

  <!-- Node 5: amux-mypai-main Orchestrator (Focal 2) -->
  <rect x="808" y="280" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="808" y="280" width="160" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="816" y="286" width="36" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="834" y="295" class="node-tag" fill="#eb6c36">BRAIN</text>
  <text x="888" y="326" class="node-title">mypai-main</text>
  <text x="888" y="344" class="node-sub">TELOS · Kanban Owner</text>

  <!-- Node 6: amux-mypai-cron -->
  <rect x="808" y="168" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="808" y="168" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="816" y="174" width="36" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
  <text x="834" y="183" class="node-tag">CRON</text>
  <text x="888" y="214" class="node-title">mypai-cron</text>
  <text x="888" y="232" class="node-sub">Silent Sweep Reactor</text>

  <!-- Node 7: Task Worker 1 -->
  <rect x="600" y="416" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="416" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="608" y="422" width="44" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
  <text x="630" y="431" class="node-tag">WORKER</text>
  <text x="680" y="452" class="node-title">task-worker-1</text>
  <text x="680" y="468" class="node-sub">repos/backend-core</text>

  <!-- Node 8: Task Worker 2 -->
  <rect x="600" y="488" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="600" y="488" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="608" y="494" width="44" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
  <text x="630" y="503" class="node-tag">WORKER</text>
  <text x="680" y="524" class="node-title">task-worker-2</text>
  <text x="680" y="540" class="node-sub">repos/frontend-app</text>

  <!-- Node 9: Hindsight Memory Store -->
  <rect x="960" y="400" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="960" y="400" width="160" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="968" y="406" width="44" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-width="0.8"/>
  <text x="990" y="415" class="node-tag">MEMORY</text>
  <text x="1040" y="446" class="node-title">Hindsight</text>
  <text x="1040" y="464" class="node-sub">:28888 · Vector Banks</text>

  <!-- Node 10: aoe Observability Cockpit -->
  <rect x="72" y="432" width="160" height="96" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="432" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="80" y="438" width="52" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
  <text x="106" y="447" class="node-tag">COCKPIT</text>
  <text x="152" y="478" class="node-title">Agent of Empires</text>
  <text x="152" y="496" class="node-sub">:28080 · TUI / PWA Mesh</text>

  <!-- Editorial Aside Callout -->
  <text x="240" y="136" class="aside">"Zero daemon overhead — all inter-session state routes via pure HTTP/REST and in-kernel IPC"</text>

  <!-- Legend (Horizontal Strip) -->
  <line x1="48" y1="608" x2="1152" y2="608" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="48" y="628" class="legend-title">LEGEND</text>

  <rect x="144" y="620" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="168" y="630" class="legend-lbl">Core Brain / Coordinator</text>

  <rect x="360" y="620" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="384" y="630" class="legend-lbl">Session / Gateway Process</text>

  <rect x="580" y="620" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="604" y="630" class="legend-lbl">Persistent Storage / Memory</text>

  <line x1="800" y1="626" x2="824" y2="626" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="836" y="630" class="legend-lbl">REST / HTTP Bus</text>

  <line x1="970" y1="626" x2="994" y2="626" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1006" y="630" class="legend-lbl">Scheduled / Async Event</text>
</svg>
