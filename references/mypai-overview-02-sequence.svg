<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #2d3142; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 12px; fill: #4f5d75; }
      .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.18em; text-transform: uppercase; }
      .actor-title { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
      .actor-sub { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
      .msg-text { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #2d3142; letter-spacing: 0.04em; text-anchor: middle; }
      .legend-title { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; }
      .legend-lbl { font-family: 'Geist', sans-serif; font-size: 11px; fill: #2d3142; }
      .aside { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 14px; fill: #eb6c36; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="48" y="44" class="eyebrow">VIEW 02 · ORCHESTRATION TIMELINE</text>
  <text x="48" y="76" class="title">Interactive Turn Routing &amp; Asynchronous Message Sequence</text>
  <text x="48" y="96" class="subtitle">End-to-end trace of a user request through channel ingress, amux message bus, main orchestration, and worker verification</text>

  <!-- Lifelines -->
  <!-- 1. User: x=100 -->
  <line x1="100" y1="168" x2="100" y2="672" stroke="rgba(45,49,66,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 2. cc-connect: x=280 -->
  <line x1="280" y1="168" x2="280" y2="672" stroke="rgba(45,49,66,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 3. mypai-channel: x=480 -->
  <line x1="480" y1="168" x2="480" y2="672" stroke="rgba(45,49,66,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- 4. amux-server: x=680 -->
  <line x1="680" y1="168" x2="680" y2="672" stroke="rgba(235,108,54,0.3)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- 5. mypai-main: x=880 -->
  <line x1="880" y1="168" x2="880" y2="672" stroke="rgba(235,108,54,0.3)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- 6. task-worker: x=1080 -->
  <line x1="1080" y1="168" x2="1080" y2="672" stroke="rgba(45,49,66,0.15)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Actor Boxes Top -->
  <!-- Actor 1: User -->
  <rect x="40" y="120" width="120" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="120" width="120" height="48" rx="6" fill="rgba(79,93,117,0.08)" stroke="#7a8399" stroke-width="1"/>
  <text x="100" y="142" class="actor-title">User (Signal)</text>
  <text x="100" y="156" class="actor-sub">Client Ingress</text>

  <!-- Actor 2: cc-connect -->
  <rect x="220" y="120" width="120" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="220" y="120" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="280" y="142" class="actor-title">cc-connect</text>
  <text x="280" y="156" class="actor-sub">:9810 Bridge</text>

  <!-- Actor 3: mypai-channel -->
  <rect x="420" y="120" width="120" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="420" y="120" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="480" y="142" class="actor-title">mypai-channel</text>
  <text x="480" y="156" class="actor-sub">Chat Gateway</text>

  <!-- Actor 4: amux-server -->
  <rect x="620" y="120" width="120" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="620" y="120" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="680" y="142" class="actor-title" fill="#eb6c36">amux-server</text>
  <text x="680" y="156" class="actor-sub">:8824 Message Bus</text>

  <!-- Actor 5: mypai-main -->
  <rect x="820" y="120" width="120" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="820" y="120" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="880" y="142" class="actor-title" fill="#eb6c36">mypai-main</text>
  <text x="880" y="156" class="actor-sub">Brain / Kanban</text>

  <!-- Actor 6: task-worker -->
  <rect x="1020" y="120" width="120" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="1020" y="120" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1080" y="142" class="actor-title">task-worker-1</text>
  <text x="1080" y="156" class="actor-sub">Repo Workspace</text>

  <!-- Activation Bars -->
  <rect x="276" y="196" width="8" height="428" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <rect x="476" y="216" width="8" height="388" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
  <rect x="676" y="260" width="8" height="324" rx="2" fill="rgba(235,108,54,0.1)" stroke="#eb6c36" stroke-width="0.8"/>
  <rect x="876" y="280" width="8" height="264" rx="2" fill="rgba(235,108,54,0.1)" stroke="#eb6c36" stroke-width="0.8"/>
  <rect x="1076" y="360" width="8" height="120" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>

  <!-- Messages / Interaction Steps -->
  <!-- Step 1: User prompt -->
  <line x1="100" y1="200" x2="276" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="132" y="186" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="188" y="195" class="msg-text">1. Prompt: "Fix DB Pool"</text>

  <!-- Step 2: tmux send-keys -->
  <line x1="284" y1="224" x2="476" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="328" y="210" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="380" y="219" class="msg-text">2. tmux pane keystroke</text>

  <!-- Step 3: Self-reflect (loopback tool call) -->
  <path d="M 484 236 L 520 236 Q 528 236 528 244 L 528 252 Q 528 260 520 260 L 484 260" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="536" y="242" width="108" height="12" rx="2" fill="#f5f5f5"/>
  <text x="590" y="251" class="msg-text">3. tool.reflect(intent)</text>

  <!-- Step 4: Dispatch to amux -->
  <line x1="484" y1="276" x2="676" y2="276" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="508" y="262" width="144" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="271" class="msg-text">4. POST /messages (target: main)</text>

  <!-- Step 5: Deliver turn to main -->
  <line x1="684" y1="296" x2="876" y2="296" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="728" y="282" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="780" y="291" class="msg-text" fill="#eb6c36">5. Turn Delivery &amp; Wakeup</text>

  <!-- Step 6: Create Kanban Card -->
  <line x1="876" y1="324" x2="684" y2="324" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="716" y="310" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="780" y="319" class="msg-text">6. POST /board/cards (Doing)</text>

  <!-- Step 7: Spawn Task Worker -->
  <line x1="876" y1="352" x2="684" y2="352" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="716" y="338" width="128" height="12" rx="2" fill="#f5f5f5"/>
  <text x="780" y="347" class="msg-text">7. POST /sessions (worker-1)</text>

  <!-- Step 8: Worker executes task -->
  <line x1="684" y1="372" x2="1076" y2="372" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="828" y="358" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="884" y="367" class="msg-text">8. Launch OMP in repo</text>

  <!-- Step 9: Worker executes code and tests -->
  <path d="M 1084 396 L 1120 396 Q 1128 396 1128 404 L 1128 420 Q 1128 428 1120 428 L 1084 428" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="1136" y="406" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1164" y="415" class="msg-text">9. pytest</text>

  <!-- Step 10: Worker reports back -->
  <line x1="1076" y1="456" x2="684" y2="456" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="804" y="442" width="160" height="12" rx="2" fill="#f5f5f5"/>
  <text x="884" y="451" class="msg-text">10. POST /messages (Pass 22/22)</text>

  <!-- Step 11: Deliver result to main -->
  <line x1="684" y1="480" x2="876" y2="480" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="724" y="466" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="780" y="475" class="msg-text" fill="#eb6c36">11. Deliver completion</text>

  <!-- Step 12: Main marks card Done & retains -->
  <line x1="876" y1="512" x2="684" y2="512" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <rect x="724" y="498" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="780" y="507" class="msg-text">12. PATCH card (Done)</text>

  <!-- Step 13: Main dispatches reply to Channel -->
  <line x1="876" y1="540" x2="684" y2="540" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="704" y="526" width="152" height="12" rx="2" fill="#f5f5f5"/>
  <text x="780" y="535" class="msg-text">13. POST /messages (target: ch)</text>

  <!-- Step 14: amux notifies Channel -->
  <line x1="676" y1="568" x2="484" y2="568" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <rect x="528" y="554" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="580" y="563" class="msg-text" fill="#eb6c36">14. Deliver final turn</text>

  <!-- Step 15: Channel writes to stdout -->
  <line x1="476" y1="596" x2="284" y2="596" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="328" y="582" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="380" y="591" class="msg-text">15. Render formatted text</text>

  <!-- Step 16: cc-connect transmits to User -->
  <line x1="276" y1="624" x2="100" y2="624" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <rect x="136" y="610" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="188" y="619" class="msg-text">16. Signal reply sent</text>

  <!-- Legend -->
  <line x1="48" y1="696" x2="1152" y2="696" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="48" y="716" class="legend-title">LEGEND</text>

  <line x1="144" y1="714" x2="176" y2="714" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="188" y="718" class="legend-lbl">REST API / External Gateway</text>

  <line x1="400" y1="714" x2="432" y2="714" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <text x="444" y="718" class="legend-lbl">Turn Wakeup / Delivery Event</text>

  <line x1="680" y1="714" x2="712" y2="714" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="724" y="718" class="legend-lbl">In-Kernel IPC / Tmux Action</text>
</svg>
