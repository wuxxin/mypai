<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #2d3142; }
      .subtitle { font-family: 'Geist', sans-serif; font-size: 12px; fill: #4f5d75; }
      .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #eb6c36; letter-spacing: 0.18em; text-transform: uppercase; }
      .group-title { font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
      .group-sub { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; }
      .node-title { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
      .node-sub { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; text-anchor: middle; }
      .node-tag { font-family: 'Geist Mono', monospace; font-size: 7px; fill: #4f5d75; letter-spacing: 0.08em; text-anchor: middle; }
      .skill-tag { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #2d3142; text-anchor: middle; }
      .arrow-lbl { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #7a8399; letter-spacing: 0.06em; text-anchor: middle; }
      .legend-title { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; }
      .legend-lbl { font-family: 'Geist', sans-serif; font-size: 11px; fill: #2d3142; }
      .aside { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 14px; fill: #eb6c36; }
    </style>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="48" y="44" class="eyebrow">VIEW 05 · AGENT ROSTER &amp; SPECIALIZATION</text>
  <text x="48" y="76" class="title">Specialist Agent Roster &amp; Engineering Delegation Hierarchy</text>
  <text x="48" y="96" class="subtitle">Hub-and-spoke coordinator model dispatching to 10 domain specialists governed by strict engineering skills</text>

  <!-- Connectors from Orchestrator Hub to Groups -->
  <!-- Line down to Group 1 -->
  <path d="M 520 200 L 232 200 Q 224 200 224 208 L 224 240" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Line down to Group 2 -->
  <line x1="600" y1="200" x2="600" y2="240" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <!-- Line down to Group 3 -->
  <path d="M 680 200 L 968 200 Q 976 200 976 208 L 976 240" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- Top Hub: @orchestrator (Focal) -->
  <rect x="460" y="128" width="280" height="72" rx="8" fill="#f5f5f5"/>
  <rect x="460" y="128" width="280" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="468" y="134" width="48" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
  <text x="492" y="143" class="node-tag" fill="#eb6c36">HUB</text>
  <text x="600" y="164" class="node-title" font-size="13px">@orchestrator (Project Coordinator)</text>
  <text x="600" y="180" class="node-sub">Epic Planning · Kanban Claims · Diff Verification · Strategic Escalation</text>

  <!-- Group 1: Code & Implementation -->
  <rect x="48" y="248" width="352" height="304" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="64" y="272" class="group-title">1. Code, Search &amp; Implementation</text>
  <text x="64" y="286" class="group-sub">Rapid symbol discovery, multi-language editing &amp; syntax patching</text>

  <rect x="64" y="296" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="224" y="318" class="node-title">@scout (Codebase Discovery)</text>
  <text x="224" y="334" class="node-sub">Read-only AST symbol grapher · ast_grep · yield findings</text>

  <rect x="64" y="356" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="224" y="378" class="node-title">@pythonista (Python Specialist)</text>
  <text x="224" y="394" class="node-sub">Strict typing (mypy) · async/await · ruff/pytest compliance</text>

  <rect x="64" y="416" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="224" y="438" class="node-title">@task (General Implementation Worker)</text>
  <text x="224" y="454" class="node-sub">Multi-file feature implementation &amp; refactoring</text>

  <rect x="64" y="476" width="320" height="52" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="224" y="498" class="node-title">@patcher (Mechanical Patcher)</text>
  <text x="224" y="514" class="node-sub">Ultra-fast single-file tweaks, typos &amp; syntax fixes</text>

  <!-- Group 2: Forensic Investigation & Quality -->
  <rect x="424" y="248" width="352" height="304" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="440" y="272" class="group-title">2. Forensic Investigation &amp; Safety</text>
  <text x="440" y="286" class="group-sub">Systematic debugging, Socratic critique &amp; vulnerability auditing</text>

  <rect x="440" y="296" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="320" class="node-title">@debugger (Forensic Investigator)</text>
  <text x="600" y="336" class="node-sub">4-Phase Systematic Debugging</text>
  <text x="600" y="352" class="node-sub">DAP live stack tracing · Memory profiler</text>

  <rect x="440" y="376" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="400" class="node-title">@reviewer (Code Quality Reviewer)</text>
  <text x="600" y="416" class="node-sub">Multi-perspective review rubric</text>
  <text x="600" y="432" class="node-sub">P0–P3 structured severity findings</text>

  <rect x="440" y="456" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="480" class="node-title">@security-reviewer (Vulnerability Scanner)</text>
  <text x="600" y="496" class="node-sub">Tainted data flow · CVE analysis</text>
  <text x="600" y="512" class="node-sub">Authorization &amp; injection detector</text>

  <!-- Group 3: Design, Knowledge & Docs -->
  <rect x="800" y="248" width="352" height="304" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="816" y="272" class="group-title">3. Design, Truth &amp; Documentation</text>
  <text x="816" y="286" class="group-sub">Design systems, upstream source research &amp; memory distillation</text>

  <rect x="816" y="296" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="976" y="320" class="node-title">@designer (UI/UX Specialist)</text>
  <text x="976" y="336" class="node-sub">Token-first CSS/HTML · Layouts</text>
  <text x="976" y="352" class="node-sub">Accessibility (a11y) &amp; visual consistency</text>

  <rect x="816" y="376" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="976" y="400" class="node-title">@librarian (Source Researcher)</text>
  <text x="976" y="416" class="node-sub">Clones &amp; inspects upstream repositories</text>
  <text x="976" y="432" class="node-sub">Verifies exact API contracts &amp; quirks</text>

  <rect x="816" y="456" width="320" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
  <text x="976" y="480" class="node-title">@writer (Documentation Craftsman)</text>
  <text x="976" y="496" class="node-sub">Technical specs &amp; OpenAPI schemas</text>
  <text x="976" y="512" class="node-sub">Hindsight memory bank distillation</text>

  <!-- Engineering Skills Base Strip -->
  <rect x="48" y="568" width="1104" height="64" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
  <text x="72" y="592" class="group-title">Engineered Skills &amp; Workflows (omp/agent/skills/)</text>
  
  <rect x="72" y="600" width="192" height="24" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="168" y="616" class="skill-tag">ulw-plan (ISC Gates)</text>

  <rect x="280" y="600" width="224" height="24" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="392" y="616" class="skill-tag">systematic-debugging (4-Phase)</text>

  <rect x="520" y="600" width="200" height="24" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="620" y="616" class="skill-tag">git-master (Worktree / Safe)</text>

  <rect x="736" y="600" width="200" height="24" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="836" y="616" class="skill-tag">review-work (P0–P3 Rubric)</text>

  <rect x="952" y="600" width="184" height="24" rx="4" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="1044" y="616" class="skill-tag">test-driven-development</text>

  <!-- Legend -->
  <line x1="48" y1="672" x2="1152" y2="672" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="48" y="692" class="legend-title">LEGEND</text>

  <rect x="144" y="684" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="168" y="694" class="legend-lbl">Lead Orchestrator Hub</text>

  <rect x="360" y="684" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="384" y="694" class="legend-lbl">Specialist Execution Roster</text>

  <rect x="600" y="684" width="16" height="12" rx="2" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="624" y="694" class="legend-lbl">Reusable Engineering Skill</text>
</svg>
