providers:
  webSearchOrder:
    []
  imageOrder:
    []
modelRoles:
  default: llama.cpp/qwen3
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 2
statusLine:
  preset: default
  separator: powerline-thin
stt:
  enabled: false
  provider: local
  baseUrl: http://localhost:21080/v1
compaction:
  thresholdPercent: 85
  handoffSaveToDisk: false
  methodOrder:
    - snapcompact
    - remote
    - soft
memory:
  backend: none
autolearn:
  enabled: false
hindsight:
  apiUrl: http://localhost:28888
  bankId: oh-my-pi
  scoping: per-project-tagged
  retainMode: concise
  autoRecall: false
  autoRetain: false
  mentalModelsEnabled: true
  mentalModelAutoSeed: true
mcpServers:
  arbor:
    command: $OMP_PYTHON_VENV/bin/arbor
    args:
      - mcp
bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: false
shellMinimizer:
  sourceOutlineLevel: default
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
todo:
  remindersMax: 8
computer:
  display: all
task:
  eager: default
  maxConcurrency: 32
  agentIdleTtlMs: 420000
  prewalk: false
secrets:
  enabled: false
composer:
  shape: borderless
tools:
  intentTracing: false
  xdevDocs: builtins
contextPromotion:
  enabled: false
extendedContext: false
python:
  kernelMode: session
generate_image:
  enabled: false
speechgen:
  enabled: false
