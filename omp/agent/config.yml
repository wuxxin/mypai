    []
  imageOrder:
    []
modelRoles:
  default: google-antigravity/gemini-3.8-flash
  smol: google-antigravity/gemini-3.1-flash-lite
  task: google-antigravity/gemini-3.8-flash
  slow: google-antigravity/claude-opus-4-6:high
  plan: google-antigravity/gemini-3.1-pro:high
  review: deepseek/deepseek-v4-pro:low
  scout: google-antigravity/gemini-3.1-flash-lite
