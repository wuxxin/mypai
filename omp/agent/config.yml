providers:
  webSearchOrder: []
modelRoles:
  default: google-antigravity/gemini-3.6-flash
symbolPreset: unicode
theme:
  dark: titanium
setupVersion: 1
statusLine:
  preset: default
  separator: powerline-thin
stt:
  enabled: true
  provider: local
  baseUrl: "http://localhost:50090/v1"
compaction:
  strategy: snapcompact
  thresholdPercent: 85
  handoffSaveToDisk: false
memory:
  backend: hindsight
autolearn:
  enabled: true
hindsight:
  apiUrl: http://localhost:8888
  bankId: omp-orchestrator
  scoping: per-project-tagged
  retainMode: full-session
  autoRecall: true
  autoRetain: true
  mentalModelsEnabled: true
  mentalModelAutoSeed: true
mcpServers:
  arbor:
    command:
      - arbor
      - mcp
  chat-channel:
    command:
      - python3
      - -m
      - mypai_tools.chat_mcp
  cron-scheduler:
    command:
      - python3
      - -m
      - mypai_tools.cron_mcp
  local-speech:
    command:
      - python3
      - -m
      - mypai_tools.speech_mcp
bash:
  autoBackground:
    enabled: true
bashInterceptor:
  enabled: false
shellMinimizer:
  sourceOutlineLevel: default
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
todo:
  remindersMax: 8
computer:
  backend: auto
  display: all
task:
  eager: default
  maxConcurrency: 32
  agentIdleTtlMs: 420000
  prewalk: false
secrets:
  enabled: false
