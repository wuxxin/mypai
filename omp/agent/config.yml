      - llama.cpp/qwen3.8-flash-next:medium
      - llama.cpp/qwen3.6-35B-A3B:medium
    scout:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low