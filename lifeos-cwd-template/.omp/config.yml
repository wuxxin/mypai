# LifeOS CWD Local Configuration (~/agent-private/lifeos/.omp/config.yml)
# This file deep-merges on top of ~/.omp/agent/config.yml when running inside the LifeOS workspace.
# Data Safety Invariant: Enforces 100% local model execution for LifeOS personal context and limits concurrency to 1.

providers:
  maxInFlightRequests:
    llama.cpp: 1
    google-antigravity: 2
    deepseek: 2
    anthropic: 1

# Force all model roles to local inference by default
modelRoles:
  default: llama.cpp/qwen3
  smol: llama.cpp/qwen3
  task: llama.cpp/qwen3
  slow: llama.cpp/qwen3:high
  plan: llama.cpp/qwen3:high
  review: llama.cpp/qwen3
  scout: llama.cpp/qwen3
  patcher: llama.cpp/qwen3
  debugger: llama.cpp/qwen3:high
  security-reviewer: llama.cpp/qwen3:high
  orchestrator: llama.cpp/qwen3:high
  advisor: llama.cpp/qwen3
  vision: llama.cpp/qwen3
  tiny: llama.cpp/qwen3

# Strict single-subagent concurrency and local model overrides
task:
  maxConcurrency: 1
  maxRecursionDepth: 2
  maxEffort: high
  agentModelOverrides:
    scout: llama.cpp/qwen3
    patcher: llama.cpp/qwen3
    task: llama.cpp/qwen3
    reviewer: llama.cpp/qwen3
    debugger: llama.cpp/qwen3:high
    security-reviewer: llama.cpp/qwen3:high
    designer: llama.cpp/qwen3
    writer: llama.cpp/qwen3
    # Librarian is dedicated to external web and API documentation research (explicit cloud model)
    librarian: "google-antigravity/gemini-3.1-flash-lite"

# Scoped Hindsight memory configuration for LifeOS
hindsight:
  apiUrl: http://localhost:28888
  bankId: mypai
  scoping: global
  retainMode: concise
  autoRecall: false
  autoRetain: false
  mentalModelsEnabled: true
  mentalModelAutoSeed: true
