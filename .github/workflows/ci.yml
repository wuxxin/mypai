name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  omp-mypai-ci:
    name: omp-mypai Plugin Environment Build, Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Clone oh-my-pi for omp-rpc availability
        working-directory: submodules/omp-mypai
        run: |
          if [ ! -d "/usr/share/oh-my-pi/python/omp-rpc" ]; then
            echo "Cloning oh-my-pi into scratch directory for omp-rpc..."
            mkdir -p scratch
            git clone --depth 1 https://github.com/can1357/oh-my-pi.git scratch/oh-my-pi
          fi

      - name: Build omp-mypai env
        working-directory: submodules/omp-mypai
        run: |
          make buildenv OMP_RPC_SRC=scratch/oh-my-pi/python/omp-rpc

      - name: Run omp-mypai tests
        working-directory: submodules/omp-mypai
        run: make test

      - name: Run omp-mypai lint
        working-directory: submodules/omp-mypai
        run: make lint

      - name: Run omp-mypai tests with coverage
        working-directory: submodules/omp-mypai
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: submodules/omp-mypai/coverage.xml
          retention-days: 30

