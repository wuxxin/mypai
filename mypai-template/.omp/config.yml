# LifeOS CWD Local Configuration (~/agent-private/lifeos/.omp/config.yml)
# This file deep-merges on top of ~/.omp/agent/config.yml when running inside the LifeOS workspace.
# Data Safety Invariant: Enforces 100% local model execution for LifeOS personal context and limits concurrency.

providers:
  maxInFlightRequests:
    llama.cpp: 2
    google-antigravity: 4
    deepseek: 2
    anthropic: 1

# Force all model roles to local inference by default
modelRoles:
  default: llama.cpp/qwen3.8-flash-next:medium
  smol: llama.cpp/qwen3.8-flash-next:low
  task: llama.cpp/qwen3.8-flash-next:medium
  slow: llama.cpp/qwen3.8-flash-next:xhigh
  plan: llama.cpp/qwen3.8-flash-next:xhigh
  review: llama.cpp/qwen3.8-flash-next:medium
  scout: llama.cpp/qwen3.8-flash-next:low
  patcher: llama.cpp/qwen3.8-flash-next:low
  debugger: llama.cpp/qwen3.8-flash-next:xhigh
  security-reviewer: llama.cpp/qwen3.8-flash-next:xhigh
  orchestrator: llama.cpp/qwen3.8-flash-next:xhigh
  advisor: llama.cpp/qwen3.8-flash-next:medium
  vision: llama.cpp/qwen3.8-flash-next
  tiny: llama.cpp/qwen3.8-flash-next:minimal
  judge: llama.cpp/qwen3.8-flash-next:medium
  memory: llama.cpp/qwen3.8-flash-next:low
  commit: llama.cpp/qwen3.8-flash-next:low
  widget: llama.cpp/qwen3.8-flash-next:low
  image: llama.cpp/z-image-turbo
  speech: llama.cpp/qwen3-tts
  dictation: llama.cpp/whisper-1

# subagent concurrency and local model overrides
task:
  maxConcurrency: 2
  maxRecursionDepth: 2
  maxEffort: high
  agentModelOverrides:
    scout: llama.cpp/qwen3.8-flash-next:low
    patcher: llama.cpp/qwen3.8-flash-next:low
    task: llama.cpp/qwen3.8-flash-next:medium
    reviewer: llama.cpp/qwen3.8-flash-next:medium
    debugger: llama.cpp/qwen3.8-flash-next:xhigh
    security-reviewer: llama.cpp/qwen3.8-flash-next:xhigh
    designer: llama.cpp/qwen3.8-flash-next:medium
    writer: llama.cpp/qwen3.8-flash-next:low
    # Librarian is dedicated to external web and API documentation research (explicit cloud model)
    librarian: "google-antigravity/gemini-3.1-flash-lite"

retry:
  enabled: true
  modelFallback: true
  fallbackChains:
    default:
      - llama.cpp/qwen3.8-flash-next:medium
      - llama.cpp/qwen3.6-35B-A3B:medium
    task:
      - llama.cpp/qwen3.8-flash-next:medium
      - llama.cpp/qwen3.6-35B-A3B:medium
    slow:
      - llama.cpp/qwen3.8-flash-next:xhigh
      - llama.cpp/qwen3.6-35B-A3B:high
    plan:
      - llama.cpp/qwen3.8-flash-next:xhigh
      - llama.cpp/qwen3.6-35B-A3B:high
    review:
      - llama.cpp/qwen3.8-flash-next:medium
      - llama.cpp/qwen3.6-35B-A3B:medium
    scout:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low
    patcher:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low
    debugger:
      - llama.cpp/qwen3.8-flash-next:xhigh
      - llama.cpp/qwen3.6-35B-A3B:high
    security-reviewer:
      - llama.cpp/qwen3.8-flash-next:xhigh
      - llama.cpp/qwen3.6-35B-A3B:high
    orchestrator:
      - llama.cpp/qwen3.8-flash-next:xhigh
      - llama.cpp/qwen3.6-35B-A3B:high
    advisor:
      - llama.cpp/qwen3.8-flash-next:medium
      - llama.cpp/qwen3.6-35B-A3B:medium
    vision:
      - llama.cpp/qwen3.8-flash-next
      - llama.cpp/qwen3.6-35B-A3B
    tiny:
      - llama.cpp/qwen3.8-flash-next:minimal
      - llama.cpp/qwen3.6-35B-A3B:minimal
    judge:
      - llama.cpp/qwen3.8-flash-next:medium
      - llama.cpp/qwen3.6-35B-A3B:medium
    memory:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low
    commit:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low
    widget:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low
    smol:
      - llama.cpp/qwen3.8-flash-next:low
      - llama.cpp/qwen3.6-35B-A3B:low
    "llama.cpp/qwen3.8-flash-next":
      - llama.cpp/qwen3.6-35B-A3B

# Scoped Hindsight memory configuration for LifeOS
hindsight:
  apiUrl: http://localhost:28888
  bankId: lifeos
  scoping: global
  retainMode: concise
  autoRecall: false
  autoRetain: false
  mentalModelsEnabled: true
  mentalModelAutoSeed: true

autolearn:
  enabled: false
